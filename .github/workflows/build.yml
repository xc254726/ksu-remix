name: build

on:
  workflow_dispatch:
    inputs:
      kernel_release:
        description: '目标内核版本串（设备 uname -r 原样）'
        required: true
        default: '6.6.66-android15-8-gd43086512890-abogki423825152-4k'
      kernel_repo:
        description: '内核源码仓库'
        required: true
        default: 'https://github.com/realme-kernel-opensource/realme-cn_gt7-AndroidV-kernel-source'
      kernel_ref:
        description: '内核分支/tag'
        required: true
        default: 'master'
      defconfig:
        description: 'defconfig 名称'
        required: true
        default: 'gki_defconfig'
      ksu_repo:
        description: 'KernelSU 二改源'
        required: true
        default: 'https://github.com/xc254726/sbsu'
      ksu_ref:
        description: 'KernelSU 分支/tag'
        required: true
        default: 'main'
      ksu_mode:
        description: 'builtin 或 module'
        required: true
        default: 'builtin'
      hook_mode:
        description: 'upstream / manual / susfs'
        required: true
        default: 'upstream'
      build_kernel:
        description: '是否编译内核（关掉可只出 APK）'
        type: choice
        options: ['true', 'false']
        default: 'true'
      build_apk:
        description: '是否编译管理器 APK'
        type: choice
        options: ['true', 'false']
        default: 'true'
      apk_build_type:
        description: 'APK 构建类型'
        type: choice
        options: ['release', 'debug']
        default: 'release'
      apk_arch:
        description: 'APK 注入 ksud 的 ABI（逗号分隔）'
        required: true
        default: 'arm64-v8a'

jobs:
  kernel:
    if: ${{ inputs.build_kernel == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            clang lld llvm python3 zip unzip cpio rsync kmod
          clang --version

      - name: 准备环境变量
        run: |
          cat > .env <<'EOF'
          KERNEL_RELEASE="${{ inputs.kernel_release }}"
          KERNEL_REPO="${{ inputs.kernel_repo }}"
          KERNEL_REF="${{ inputs.kernel_ref }}"
          DEFCONFIG="${{ inputs.defconfig }}"
          KSU_REPO="${{ inputs.ksu_repo }}"
          KSU_REF="${{ inputs.ksu_ref }}"
          KSU_MODE="${{ inputs.ksu_mode }}"
          HOOK_MODE="${{ inputs.hook_mode }}"
          EOF
          sed -i 's/^ *//' .env
          cat .env

      - name: 体检
        run: make doctor

      - name: 拉源码并集成 KernelSU
        run: make fetch
        env:
          STRICT_VERSION: '0'

      - name: 生成配置
        run: make config

      - name: 编译内核
        run: make kernel

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.kernel_release }}
          path: |
            out/Image
            out/Image.gz
            out/Image.lz4
            out/kernelsu.ko
            out/include/config/kernel.release
          if-no-files-found: error
          retention-days: 30

  apk:
    if: ${{ inputs.build_apk == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # 与二改源 manager/gradle/libs.versions.toml 的 ndk 保持一致
      NDK_VERSION: '30.0.16248370'
      # 重签要用 build-tools 里的 zipalign / apksigner
      BUILD_TOOLS_VERSION: '36.1.0'
      APK_BUILD_TYPE: ${{ inputs.apk_build_type }}
      APK_ARCHES: ${{ inputs.apk_arch }}
      KSUD_ARCHES: ${{ inputs.apk_arch }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK / NDK
        run: |
          SDK="${ANDROID_SDK_ROOT}"
          export ANDROID_HOME="$SDK"
          SDKM="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          export ANDROID_NDK_HOME="$SDK/ndk/${NDK_VERSION}"
          echo "ANDROID_HOME=$ANDROID_HOME"     >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          # 缺哪个装哪个；AGP 也会自动补，但显式装更快且日志清楚
          # build-tools 是重签阶段（zipalign / apksigner）硬依赖，不能省
          "$SDKM" --install "ndk;${NDK_VERSION}" "platform-tools" "build-tools;${BUILD_TOOLS_VERSION}" || true
          ls -d "$SDK/ndk"/* 2>/dev/null || true
          ls -d "$SDK/build-tools"/* 2>/dev/null || true

      - name: 安装 Rust nightly + cargo-ndk
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup default nightly
          cargo install cargo-ndk --locked
          cargo ndk --version

      - name: 准备环境变量
        run: |
          cat > .env <<'EOF'
          KSU_REPO="${{ inputs.ksu_repo }}"
          KSU_REF="${{ inputs.ksu_ref }}"
          APK_BUILD_TYPE="${{ inputs.apk_build_type }}"
          KSUD_ARCHES="${{ inputs.apk_arch }}"
          EOF
          sed -i 's/^ *//' .env
          cat .env

      - name: 编译管理器 APK
        run: make manager

      - name: 编译 ksud
        run: make ksud

      - name: 注入 ksud 并重签
        run: bash scripts/pack-apk.sh "${{ inputs.apk_build_type }}"

      - name: 收集 APK
        uses: actions/upload-artifact@v4
        with:
          name: manager-${{ inputs.apk_build_type }}-${{ github.run_number }}
          path: |
            out/apk/*.apk
            out/remix-signing.txt
          if-no-files-found: error
          retention-days: 30
